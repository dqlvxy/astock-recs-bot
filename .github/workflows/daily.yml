name: 每日稳健版荐股 + 全模块快照

# 北京时间 14:15 = UTC 06:15，周一~周五
#   —— 老板流程：14:30 荐股定稿 → 14:50 尾盘买入 → 次日涨了卖。
#   故 cron 提前到 14:15 触发，给 GitHub 免费版 cron 的 5~20 分钟延迟留缓冲，
#   保证定稿在 14:50 买入前一定落到云端（原先 14:30 触发，实测曾延迟到 15:12 才出，
#   用户 14:50 买入时云端还没有今日荐股，只能看本地引擎预演，导致两版不一致）。
#   定稿一经生成即冻结：当日已有存档则 generate.js 跳过重算，不覆盖；
#   需强制重算时用 workflow_dispatch 并勾选 force。
on:
  schedule:
    - cron: "15 6 * * 1-5"
  workflow_dispatch:
    inputs:
      force:
        description: "强制重算并覆盖当日定稿（默认否：保持当日已有定稿不变）"
        type: boolean
        default: false

permissions:
  contents: write        # 允许把 recs.json / today.json / watch.json 提交回仓库

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: 安装依赖
        run: npm ci

      # ── ① 尾盘荐股：产出 recs.json（历史存档，多期累积）──────────────
      #   当日已有定稿则跳过重算（冻结）；勾选 force 可强制覆盖。
      - name: 运行稳健版选股并生成 recs.json
        run: node generate.js
        env:
          # 若配了这三个 Secret（且 token 有 KV 权限）则写 KV；否则自动写 recs.json
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_KV_NAMESPACE_ID: ${{ secrets.CF_KV_NAMESPACE_ID }}
          FORCE: ${{ github.event.inputs.force || '' }}

      # ── ② 全模块快照：产出 today.json（当日覆盖）+ watch.json（自选行情）
      #     覆盖前端 T1D 内嵌快照的 12 个字段：index / market_stat / zt_total /
      #     ladder / lhb / yaogu / hit_total / temperature / main_lines / trade_date …
      #     自选清单从 watchlist.json 读（不存在则用内置兜底 7 只），
      #     个股走东财全市场、ETF/LOF 走腾讯行情补齐名称与换手。
      - name: 生成全模块云端快照 today.json + watch.json
        run: node today.js
        env:
          TODAY_FILE: today.json
          WATCH_FILE: watchlist.json

      # ── ③ 把三份产物提交回仓库（jsdelivr 即可直接分发）──────────────
      # ⚠ 本步骤所有 shell 变量必须用 ASCII 名，禁用中文变量名。
      #   Actions runner 的 sh 走 POSIX 模式，中文变量名会被当成命令，
      #   报 "xxx=0: command not found" 并以 exit 127 终止 ——
      #   实测 2026-10-09 / 10-12 两次运行都死在这里：选股与快照都生成成功，
      #   却因提交失败导致数据进不了仓库，看板走势图长期停在旧数据。
      #   修复前曾误以为只影响自检脚本，实际 workflow 同样中招，勿再踩。
      - name: 提交快照文件回仓库
        run: |
          git config user.name "astock-bot"
          git config user.email "astock-bot@users.noreply.github.com"

          HAS_FILE=0
          for f in recs.json today.json watch.json; do
            if [ -f "$f" ]; then
              git add "$f"
              HAS_FILE=1
            else
              echo "$f 不存在（可能非交易日），跳过"
            fi
          done

          if [ "$HAS_FILE" = "0" ]; then
            echo "没有任何快照文件可提交"
            exit 0
          fi

          if git diff --cached --quiet; then
            echo "文件无变化，无需提交"
          else
            git commit -m "chore: 更新荐股存档与全模块快照 $(date -u +'%Y-%m-%d %H:%M UTC')"
            # 先 rebase 再推：避免与沙箱/手动提交并发时 non-fast-forward 被拒
            git pull --rebase --autostash origin main || true
            git push origin main
          fi

      # ── ③' 刷新 jsDelivr CDN 缓存（关键，别删）────────────────────
      # 前端优先读「提交哈希地址」（内容寻址，永远不会陈旧），本步骤是保底：
      # 分支地址 @main 仍被部分场景读到，purge 能刷就刷。
      # 注意：实测分支缓存 purge 后仍可能返回旧内容，所以哈希地址才是主路径。
      - name: 刷新 jsDelivr CDN 缓存
        run: |
          for f in recs.json today.json watch.json; do
            if [ -f "$f" ]; then
              echo "purge $f ..."
              code=$(curl -s -o /dev/null -w "%{http_code}" \
                --max-time 30 \
                "https://purge.jsdelivr.net/gh/${{ github.repository }}@main/$f" || echo "000")
              echo "  -> HTTP $code"
            fi
          done
          echo "缓存刷新请求已发出（200 表示受理）"

      # ── ③'' 把本次提交哈希写回看板页面（关键，别删）─────────────────
      # 看板前端优先请求 @<提交哈希> 地址：jsDelivr 的分支地址 @main 会被
      # 边缘节点长期缓存旧版本，连 purge 都清不掉，导致看板展示过期数字。
      # 哈希地址是内容寻址，拿到的一定是本次提交的最新内容。
      # 这里把页面里的占位符 __BUILD_COMMIT__ 替换成真实短哈希，
      # 再由下一步部署到 Cloudflare Pages。
      - name: 把提交哈希注入看板页面
        run: |
          HASH=$(git rev-parse --short HEAD)
          echo "本次提交哈希：$HASH"
          # 看板页面可能在仓库根的 index.html，也可能由 Pages 项目单独维护；
          # 存在才替换，不存在则跳过（不报错）。
          for p in index.html board/index.html public/index.html; do
            if [ -f "$p" ]; then
              sed -i "s/__BUILD_COMMIT__/$HASH/g" "$p"
              echo "已写入 $p"
            fi
          done
          echo "$HASH" > .build-commit
          echo "哈希文件已生成（供外部部署脚本读取）"

      # ── ④ 上传产物，便于手动下载检查 ───────────────────────────────
      - name: 上传产物
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: astock-snapshots
          path: |
            recs.json
            today.json
            watch.json
          if-no-files-found: warn
          retention-days: 7

# 说明：
#   前端读取地址（jsdelivr CDN，沙箱/手机均可达）：
#     优先  https://cdn.jsdelivr.net/gh/<用户名>/astock-recs-bot@<提交哈希>/xxx.json
#     回退  https://cdn.jsdelivr.net/gh/<用户名>/astock-recs-bot@main/xxx.json
#   为什么优先哈希：分支地址会被 CDN 边缘长期缓存旧版且 purge 无效，
#   哈希地址内容寻址、永不陈旧。
#   不在此处部署 Pages，避免误覆盖看板页面。
