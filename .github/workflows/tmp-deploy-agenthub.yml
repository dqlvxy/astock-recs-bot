name: 临时部署 agent-hub-mcp（一次用）

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-deploy-agenthub.yml'
      - 'deploy-agenthub-oneshot/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 取出仓库
        uses: actions/checkout@v4

      - name: 装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 查生产分支并部署
        working-directory: deploy-agenthub-oneshot
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          set -e
          echo "第一步：核对令牌与项目"
          curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/user/tokens/verify" \
            | jq -r '"token_ok=" + (.success|tostring) + " status=" + (.result.status // "n/a")'
          PROJ=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/agent-hub-mcp")
          echo "$PROJ" | jq -r '"project=" + (.result.name // "NONE") + " prod_branch=" + (.result.production_branch // "NONE") + " success=" + (.success|tostring)'
          BRANCH=$(echo "$PROJ" | jq -r '.result.production_branch // "main"')
          echo "本次按生产分支 $BRANCH 部署"
          echo "第二步：wrangler 部署"
          npx --yes wrangler@4.158.0 pages deploy \
            --project-name=agent-hub-mcp \
            --branch="$BRANCH" \
            --commit-dirty=true
          echo "第三步：回读线上状态"
          curl -s -o /tmp/probe.json -w "probe_http=%{http_code}\n" \
            "https://agent-hub-mcp.pages.dev/api/mcp"
          head -c 200 /tmp/probe.json; echo
