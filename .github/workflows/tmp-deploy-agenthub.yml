name: 临时部署 agent-hub-mcp（一次用）

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-deploy-agenthub.yml'
      - 'deploy-agenthub-oneshot/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 取出仓库
        uses: actions/checkout@v4

      - name: 装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 诊断各 Pages 项目归属
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          set -u
          API=https://api.cloudflare.com/client/v4
          for p in astock-grid astock-board astock-mcp node-pages agent-hub-mcp; do
            curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$API/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$p" \
              | jq -c --arg n "$p" '{ask:$n,success:.success,errors:.errors,name:.result.name,subdomain:.result.subdomain,domains:.result.domains,created:.result.created_on,latest_id:.result.latest_deployment.id,latest_url:.result.latest_deployment.url,latest_env:.result.latest_deployment.environment}'
          done

      - name: 注入项目密钥
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          MCP_TOKEN_VAL: ${{ secrets.MCP_TOKEN }}
          GH_TOKEN_VAL: ${{ secrets.AGENTHUB_GH_TOKEN }}
        run: |
          set -u
          printf '%s' "$MCP_TOKEN_VAL" | npx --yes wrangler@4.158.0 pages secret put MCP_TOKEN --project-name=agent-hub-mcp
          printf '%s' "$GH_TOKEN_VAL" | npx --yes wrangler@4.158.0 pages secret put GITHUB_TOKEN --project-name=agent-hub-mcp
          echo "两个密钥已写入项目环境"

      - name: 部署
        working-directory: deploy-agenthub-oneshot
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          set -u
          npx --yes wrangler@4.158.0 pages deploy \
            --project-name=agent-hub-mcp \
            --branch=main \
            --commit-dirty=true

      - name: 线上验收
        env:
          MCP_TOKEN_VAL: ${{ secrets.MCP_TOKEN }}
        run: |
          set -u
          echo "===== 探活 ====="
          curl -s -o /tmp/probe.json -w "probe_http=%{http_code}\n" "https://agent-hub-mcp.pages.dev/api/mcp"
          head -c 120 /tmp/probe.json; echo
          echo "===== tools/list 标题 ====="
          curl -s -X POST "https://agent-hub-mcp.pages.dev/api/mcp" \
            -H "content-type: application/json" \
            -H "Authorization: Bearer $MCP_TOKEN_VAL" \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' \
            | jq -r '.result.tools[]? | .name + " → " + (.title // "【无标题】")'
          echo "===== tools/call status ====="
          curl -s -X POST "https://agent-hub-mcp.pages.dev/api/mcp" \
            -H "content-type: application/json" \
            -H "Authorization: Bearer $MCP_TOKEN_VAL" \
            -d '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"status","arguments":{}}}' \
            | jq -r '.result.content[0].text' | head -c 300
          echo
          echo "===== 正式网关端点标题 ====="
          curl -s -X POST "https://agent-hub-mcp.app.workbuddy.host/api/mcp?sharecode=XW6PS5W2KI" \
            -H "content-type: application/json" \
            -H "x-mcp-token: $MCP_TOKEN_VAL" \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' \
            | jq -r '.result.tools[]? | .name + " → " + (.title // "【无标题】")'
