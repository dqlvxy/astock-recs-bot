name: 每日收盘复盘 + 策略自动优化

# A股收盘 15:00，复盘 15:30 跑：验证上期荐股「次日收盘」表现 → 归因失败 → 生成优化参数
# 北京时间 15:30 = UTC 07:30，周一~周五
on:
  schedule:
    - cron: "30 7 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write        # 允许把 review_log.json / params.json / review.md 提交回仓库

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: 安装依赖
        run: npm ci

      # ── ① 收盘复盘：读 recs.json → 验证上期次日收盘 → 归因 → 产出 review_log.json / params.json / review.md ──
      - name: 运行收盘复盘脚本
        run: |
          # 打印耗时：180 天满窗（约 120 期）时需要观测是否逼近 timeout-minutes。
          # 实测单次东财 K 线约 60ms，全量 420 次 ≈ 25 秒，20 分钟上限余量充足（2026-11-09 实测）。
          START=$(date +%s)
          node review.js
          echo "复盘耗时 $(( $(date +%s) - START )) 秒（timeout-minutes: 30）"

      # ── ② 提交复盘产物回仓库（jsDelivr 分发）──────────────
      # 推送逻辑全部在 scripts/提交产物.sh：带 5 轮重试、rebase 冲突 abort 后重试、
      # 全失败打印 ::error:: 并 exit 1（绝不静默吞掉产物）。
      # 抽成脚本的原因：改 `.github/workflows/**` 需要 PAT 具备 workflow scope，
      # 缺了 GitHub 返回 404 而非 403，排查成本高；改推送策略只动脚本即可。
      - name: 提交复盘产物
        run: bash scripts/提交产物.sh review_log.json params.json review.md

      # ── ③ 刷新 jsDelivr CDN 缓存（保底；前端主路径是提交哈希地址）──────────────
      - name: 刷新 CDN 缓存
        run: |
          for f in review_log.json params.json review.md; do
            if [ -f "$f" ]; then
              code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "https://purge.jsdelivr.net/gh/${{ github.repository }}@main/$f" || echo "000")
              echo "$f -> HTTP $code"
            fi
          done
          echo "缓存刷新请求已发出（200 表示受理）"

      # ── ④ 上传产物，便于手动下载检查 ─────────────────────────────
      - name: 上传产物
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: astock-review
          path: |
            review_log.json
            params.json
            review.md
          if-no-files-found: warn
          retention-days: 7
